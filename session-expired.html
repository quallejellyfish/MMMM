<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MMMM is a multi-page site created by wolfi and made for the userscript part MMM to have a easier way to manage and store songs and their lyrics"
    />
    <meta
      name="keywords"
      content="MMMM, MMM, MusicMenuModManager, MusicModMenu"
    />
    <meta name="author" content="wolfi" />
    <title>Session Expired - Music Menu Mod Manager</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #1e1e2f;
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .container {
        background: #2d2d3a;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        color: #ff5555;
      }
      p {
        font-size: 1.2rem;
        margin-bottom: 30px;
        color: #aaa;
        line-height: 1.6;
      }
      button {
        background: #ff79c6;
        border: none;
        padding: 14px 40px;
        border-radius: 12px;
        font-size: 1.3rem;
        font-weight: bold;
        cursor: pointer;
        color: #1e1e2f;
        transition: background 0.2s;
      }
      button:hover {
        background: #ba4085;
      }
      .redirect-info {
        margin-top: 20px;
        font-size: 0.9rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Session Expired</h1>
      <p>
        Your session has expired. Please log in again to continue using the
        private manager.
      </p>
      <button id="goHomeBtn">Go to Home</button>
      <div class="redirect-info" id="redirectInfo">
        Redirecting in 5 seconds...
      </div>
    </div>

    <script>
      let seconds = 5;
      const infoEl = document.getElementById("redirectInfo");

      document.getElementById("goHomeBtn").addEventListener("click", () => {
        window.location.href = "/";
      });

      const interval = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = "/";
        } else {
          infoEl.textContent = `Redirecting in ${seconds} seconds...`;
        }
      }, 1000);
    </script>
  </body>
</html>
