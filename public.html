<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MMMM is a multi-page site created by wolfi and made for the userscript part MMM to have a easier way to manage and store songs and their lyrics"
    />
    <meta
      name="keywords"
      content="MMMM, MMM, MusicMenuModManager, MusicModMenu"
    />
    <meta name="author" content="wolfi" />
    <title>Public Songs - MMMM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Hammersmith One", sans-serif;
      }
      body {
        background: #1e1e2f;
        color: #eee;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .card {
        background: #2d2d3a;
        border-radius: 16px;
        padding: 20px;
        margin: 20px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #444;
      }
      th {
        background: #3a3a4a;
      }
      .status {
        background: #3a3a4a;
        padding: 8px 16px;
        border-radius: 12px;
        margin: 10px 0 25px 0;
      }
      button {
        background: #ff79c6;
        border: none;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      button:hover {
        background: #ba4085;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: #2d2d3a;
        max-width: 700px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid #ff79c6;
        position: relative;
      }
      .modal-content pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: #0f0f17;
        padding: 12px;
        border-radius: 8px;
        color: #ccc;
        max-height: 50vh;
        overflow-y: auto;
        font-family: monospace;
        font-size: 14px;
        margin-top: 10px;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .modal-close {
        background: #ff5555;
        border: none;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        font-weight: bold;
      }
      .modal-close:hover {
        background: #cc3333;
      }
      .copy-btn {
        background: #3498db;
        border: none;
        padding: 6px 16px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        font-weight: bold;
      }
      .copy-btn:hover {
        background: #2980b9;
      }
      .container h1 a {
        transition:
          color 0.4s ease-in-out,
          text-decoration-style 0.9s ease-in-out;
        color: #fff;
        font-size: 1.7rem;
        text-decoration: underline;
      }
      .container h1 a:hover {
        color: #a4a4a4 !important;
        text-decoration-style: wavy !important;
        text-decoration-color: #fff;
      }
      a {
        color: #ff79c6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>
        <span>MMMM - Music Menu Mod Manager</span>
        <span>|</span>
        <a href="/stats.html">Go to Stats Leaderboard</a>
      </h1>
      <a href="/">Back to Home</a>
      <div class="card">
        <div class="status" id="statusMsg">Loading...</div>
        <table id="songsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>URL</th>
              <th>Lyrics</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="songsTableBody">
            <tr>
              <td colspan="5">No public songs yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Lyrics Modal -->
    <div id="lyricsModal" class="modal">
      <div class="modal-content">
        <h3 id="modalTitle">Lyrics</h3>
        <pre id="modalBody">Loading...</pre>
        <div class="modal-actions">
          <button class="copy-btn" id="copyLyricsBtn">Copy to Clipboard</button>
          <button class="modal-close" onclick="closeModal()">✕ Close</button>
        </div>
      </div>
    </div>

    <script>
      let songList = [];
      let lyricCache = {};
      let currentLyrics = [];

      async function fetchPublicSongs() {
        try {
          const res = await fetch("/public/songs");
          if (!res.ok) throw new Error(await res.text());
          songList = await res.json();
          renderTable();
          document.getElementById("statusMsg").innerHTML =
            `Loaded ${songList.length} public songs.`;
        } catch (e) {
          document.getElementById("statusMsg").innerHTML =
            `Error: ${e.message}`;
        }
      }

      async function fetchPublicLyrics(songId) {
        if (lyricCache[songId]) return lyricCache[songId];
        try {
          const res = await fetch(`/public/lyrics/${songId}`);
          if (!res.ok) return [];
          const data = await res.json();
          lyricCache[songId] = data;
          return data;
        } catch (e) {
          return [];
        }
      }

      function renderTable() {
        const tbody = document.getElementById("songsTableBody");
        if (!songList.length) {
          tbody.innerHTML =
            '<tr><td colspan="5">No public songs available.</td></tr>';
          return;
        }
        tbody.innerHTML = "";
        songList.forEach((song) => {
          const row = tbody.insertRow();
          row.insertCell(0).textContent = song.id;
          row.insertCell(1).textContent = song.name;
          row.insertCell(2).innerHTML =
            `<a href="${song.url}" target="_blank">link</a>`;
          const count = song.lyricsCount || 0;
          row.insertCell(3).textContent = `${count} lines`;

          // Actions cell
          const actionsCell = row.insertCell(4);
          const viewBtn = document.createElement("button");
          viewBtn.textContent = "View";
          viewBtn.addEventListener("click", () => {
            openLyricsModal(song.id);
          });
          actionsCell.appendChild(viewBtn);
        });
      }

      async function openLyricsModal(songId) {
        const modal = document.getElementById("lyricsModal");
        const body = document.getElementById("modalBody");
        const title = document.getElementById("modalTitle");
        const song = songList.find((s) => s.id === songId);
        title.textContent = `Lyrics for "${song ? song.name : songId}"`;

        let lyrics = await fetchPublicLyrics(songId);
        currentLyrics = lyrics;
        if (!lyrics || lyrics.length === 0) {
          body.textContent = "No lyrics available.";
        } else {
          body.textContent = JSON.stringify(lyrics, null, 2);
        }
        modal.style.display = "flex";
      }

      function closeModal() {
        document.getElementById("lyricsModal").style.display = "none";
      }

      document.getElementById("copyLyricsBtn").addEventListener("click", () => {
        const body = document.getElementById("modalBody");
        const text = body.textContent;
        if (!text || text === "No lyrics available." || text === "Loading...") {
          alert("Nothing to copy.");
          return;
        }
        navigator.clipboard
          .writeText(text)
          .then(() => {
            const btn = document.getElementById("copyLyricsBtn");
            const orig = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => {
              btn.textContent = orig;
            }, 1500);
          })
          .catch(() => {
            alert("Failed to copy. Select the text manually and press Ctrl+C.");
          });
      });

      document.getElementById("lyricsModal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeModal();
      });

      fetchPublicSongs();
    </script>
  </body>
</html>
