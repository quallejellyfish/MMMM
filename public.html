<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Songs - MMMM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hammersmith+One&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Hammersmith One", sans-serif;
      }
      body {
        background: #1e1e2f;
        color: #eee;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .card {
        background: #2d2d3a;
        border-radius: 16px;
        padding: 20px;
        margin: 20px 0;
      }
      a {
        color: #ff79c6;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #444;
      }
      th {
        background: #3a3a4a;
      }
      .status {
        background: #3a3a4a;
        padding: 8px 16px;
        border-radius: 12px;
        margin-top: 10px;
      }
      button {
        background: #ff79c6;
        border: none;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background: #ba4085;
      }
      .lyrics-cell {
        max-width: 400px;
        overflow: hidden;
      }
      .lyrics-content {
        display: none;
        max-height: 200px;
        overflow-y: auto;
        background: #0f0f17;
        padding: 8px;
        border-radius: 6px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 13px;
        color: #ccc;
        margin-top: 6px;
      }
      .lyrics-content.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Public Songs</h1>
      <a href="/">Back to Home</a>
      <div class="card">
        <div class="status" id="statusMsg">Loading...</div>
        <table id="songsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>URL</th>
              <th>Lyrics</th>
            </tr>
          </thead>
          <tbody id="songsTableBody">
            <tr>
              <td colspan="4">No public songs yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      let songList = [];
      let lyricCache = {};

      async function fetchPublicSongs() {
        try {
          const res = await fetch("/public/songs");
          if (!res.ok) throw new Error(await res.text());
          songList = await res.json();
          renderTable();
          document.getElementById("statusMsg").innerHTML =
            `Loaded ${songList.length} public songs.`;
        } catch (e) {
          document.getElementById("statusMsg").innerHTML =
            `Error: ${e.message}`;
        }
      }

      async function fetchPublicLyrics(songId) {
        if (lyricCache[songId]) return lyricCache[songId];
        try {
          const res = await fetch(`/public/lyrics/${songId}`);
          if (!res.ok) return [];
          const data = await res.json();
          lyricCache[songId] = data;
          return data;
        } catch (e) {
          return [];
        }
      }

      function renderTable() {
        const tbody = document.getElementById("songsTableBody");
        if (!songList.length) {
          tbody.innerHTML =
            '<tr><td colspan="4">No public songs available.</td></tr>';
          return;
        }
        tbody.innerHTML = "";
        songList.forEach((song) => {
          const row = tbody.insertRow();
          row.insertCell(0).textContent = song.id;
          row.insertCell(1).textContent = song.name;
          row.insertCell(2).innerHTML =
            `<a href="${song.url}" target="_blank">link</a>`;

          const cellLyrics = row.insertCell(3);
          const count = song.lyricsCount || 0;
          const toggleBtn = document.createElement("button");
          toggleBtn.textContent = "Show lyrics";
          const container = document.createElement("div");
          container.innerHTML = `<span>${count} lines</span> `;
          container.appendChild(toggleBtn);
          const pre = document.createElement("pre");
          pre.className = "lyrics-content";
          pre.textContent = "Loading...";
          container.appendChild(pre);
          cellLyrics.appendChild(container);

          let isOpen = false;
          toggleBtn.addEventListener("click", async () => {
            if (!isOpen) {
              if (!lyricCache[song.id]) {
                const lyrics = await fetchPublicLyrics(song.id);
                if (lyrics.length) {
                  pre.textContent = lyrics
                    .map((l) => `[${l.delay}ms] ${l.chat}`)
                    .join("\n");
                } else {
                  pre.textContent = "No lyrics available.";
                }
              }
              pre.classList.add("open");
              toggleBtn.textContent = "Hide lyrics";
              isOpen = true;
            } else {
              pre.classList.remove("open");
              toggleBtn.textContent = "Show lyrics";
              isOpen = false;
            }
          });
        });
      }

      fetchPublicSongs();
    </script>
  </body>
</html>
