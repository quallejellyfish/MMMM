<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMMM - Music Menu Mod Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: "Hammersmith One", sans-serif;
      }
      body {
        background: #1e1e2f;
        color: #eee;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .card {
        background: #2d2d3a;
        border-radius: 16px;
        padding: 20px;
        margin: 20px 0;
      }
      button,
      .button {
        background: #ff79c6;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        margin: 4px;
        transition: background 0.3s ease-in-out;
      }
      button:hover {
        background: #ba4085;
      }
      button.danger:hover {
        background: #990f0f;
      }
      .danger {
        background: #ff5555;
      }
      a:hover {
        color: #ba4085;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        background: #3a3a4a;
        border: 1px solid #555;
        border-radius: 8px;
        color: #fff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #444;
      }
      .flex {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .status {
        background: #3a3a4a;
        padding: 8px 16px;
        border-radius: 12px;
      }
      .small {
        font-size: 12px;
        color: #aaa;
      }
      pre {
        background: #0f0f17;
        padding: 12px;
        border-radius: 12px;
        overflow-x: auto;
      }
      .drag-handle:hover svg path {
        fill: #fff !important;
      }
      tr.drag-over {
        border-top: 3px solid #ff79c6;
        background: rgba(255, 121, 198, 0.08);
      }
      .drag-ghost {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        border: 2px solid #ff79c6 !important;
      }
      #songsTableBody tr {
        transition: opacity 0.15s ease;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>MMMM - Music Menu Mod Manager</h1>
      <div class="card">
        <div class="flex">
          <label
            >API URL:
            <input type="text" id="apiUrl" value="" style="width: 300px"
          /></label>
          <label
            >API KEY: <input type="password" id="apiKey" style="width: 300px"
          /></label>
          <button id="refreshBtn">Refresh</button>
          <button id="syncGitBtn">Sync to GitHub</button>
        </div>
        <div class="status" id="statusMsg"></div>
      </div>
      <div class="card">
        <h2>Add / Edit Songs</h2>
        <input type="hidden" id="editId" />
        <label>Song Name</label>
        <input
          type="text"
          id="songName"
          placeholder="however you call your song"
        />
        <label>Audio URL</label>
        <input
          type="url"
          id="audioUrl"
          placeholder="jukehost or whatever ends with .mp3"
        />
        <label>Category (only for new songs)</label><br />
        <select id="categorySelect" style="font-size: 1rem">
          <option value="0">🇺🇸 English</option>
          <option value="1">🇩🇪 German</option>
          <option value="2">🇨🇳 Chinese</option>
          <option value="3">💥 Pulary</option>
          <option value="4">🌍 Other Languages</option>
          <option value="5">🦊 Krimsonthefox</option>
          <option value="6">❓ Not My Songs</option>
        </select>
        <br /><br />
        <label>Lyrics</label>
        <textarea
          id="lyrics"
          rows="6"
          placeholder="[{chat: 'boob' ,delay:0}]"
        ></textarea>
        <div class="flex">
          <button id="convertBtn">Convert to JSON</button>
          <button id="saveBtn">Save</button>
          <button id="clearBtn">Clear</button>
          <button id="deleteBtn" class="danger" style="display: none">
            Delete this song
          </button>
        </div>
      </div>
      <div class="card">
        <h2>Songs on Server</h2>
        <table id="songsTable">
          <thead>
            <tr>
              <th style="width: 30px"></th>
              <th>ID</th>
              <th>Name</th>
              <th>URL</th>
              <th>Lyrics</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="songsTableBody">
            <tr>
              <td colspan="5">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <script>
      let songList = [];

      function getApiUrl() {
        return document.getElementById("apiUrl").value.replace(/\$/, "");
      }
      function getApiKey() {
        return document.getElementById("apiKey").value;
      }

      async function apiRequest(endpoint, method, body = null) {
        const url = `${getApiUrl()}${endpoint}`;
        const headers = {
          "Content-Type": "application/json",
          "X-API-Key": getApiKey(),
        };
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(url, options);
        if (!res.ok) {
          const error = await res.text();
          throw new Error(`API error ${res.status}: ${error}`);
        }
        return res.json();
      }

      async function loadSongs() {
        try {
          const url = `${getApiUrl()}/songs`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(await res.text());
          songList = await res.json();
          songsHash = JSON.stringify(songList);
          renderTable();
          document.getElementById("statusMsg").innerHTML =
            `Loaded ${songList.length} songs`;
        } catch (err) {
          document.getElementById("statusMsg").innerHTML =
            `Error: ${err.message}`;
          // console.error(err);
        }
      }

      async function loadLyrics(songId) {
        const url = `${getApiUrl()}/songs/${songId}/lyrics`;
        const res = await fetch(url);
        if (!res.ok) return [];
        return res.json();
      }

      async function saveSong() {
        const editId = document.getElementById("editId").value;
        const name = document.getElementById("songName").value.trim();
        const url = document.getElementById("audioUrl").value.trim();
        const lyricsText = document.getElementById("lyrics").value.trim();
        const categoryIndex = parseInt(
          document.getElementById("categorySelect").value,
        );

        if (!name || !url) return alert("Name and URL are required");

        let lyricsArray = [];
        if (lyricsText) {
          try {
            lyricsArray = JSON.parse(lyricsText);
            if (!Array.isArray(lyricsArray)) throw new Error();
            for (let item of lyricsArray) {
              if (
                typeof item.chat !== "string" ||
                typeof item.delay !== "number"
              )
                throw new Error();
            }
          } catch (e) {
            alert("Lyrics are not correct");
            return;
          }
        }

        try {
          if (editId === "") {
            const newSong = await apiRequest("/songs", "POST", {
              name,
              url,
              lyrics: lyricsArray,
              categoryIndex,
            });
            statusMsg.innerHTML = `✅ Added "${name}" (ID: ${newSong.id})`;
          } else {
            const idNum = parseInt(editId, 10);
            await apiRequest(`/songs/${idNum}`, "PUT", {
              name,
              url,
              categoryIndex,
            });
            await apiRequest(`/songs/${idNum}/lyrics`, "PUT", {
              lyrics: lyricsArray,
              skipDiscord: true,
            });

            statusMsg.innerHTML = `✅ Updated song ID ${idNum}`;
          }
          clearForm();
          await loadSongs();
        } catch (err) {
          console.error(err);
        }
      }

      async function editSong(id) {
        id;
        const numericId = parseInt(id, 10);
        console.log("Edit song with id:", numericId);
        if (isNaN(numericId)) {
          alert("Invalid song id");
          return;
        }
        const song = songList.find((s) => s.id === numericId);
        if (!song) {
          alert("Song not found in list");
          return;
        }
        document.getElementById("editId").value = numericId;
        document.getElementById("songName").value = song.name;
        document.getElementById("audioUrl").value = song.url;

        try {
          const lyrics = await loadLyrics(numericId);
          document.getElementById("lyrics").value = JSON.stringify(
            lyrics,
            null,
            2,
          );
        } catch (err) {
          console.error("Failed to load lyrics:", err);
          document.getElementById("lyrics").value = "[]";
        }

        document.getElementById("deleteBtn").style.display = "inline-block";
        document.getElementById("deleteBtn").onclick = () =>
          deleteSong(numericId);

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function deleteSong(id) {
        const song = songList.find((s) => s.id === id);
        if (!confirm(`Delete "${song?.name}" permantly?`)) return;
        try {
          await apiRequest(`/songs/${id}`, "DELETE");
          document.getElementById("statusMsg").innerHTML =
            `Deleted ${song.name}`;
          await loadSongs();
          if (document.getElementById("editId").value == id) clearForm();
        } catch (err) {
          alert("Deletion failed: " + err.message);
        }
      }

      function clearForm() {
        document.getElementById("editId").value = "";
        document.getElementById("songName").value = "";
        document.getElementById("audioUrl").value = "";
        document.getElementById("lyrics").value = "";
        document.getElementById("categorySelect").value = 0;
      }

      let draggedRow = null;
      let dragGhost = null;
      let dragInsertLine = null;
      let dragInitialIndex = -1;
      let ghostMouseMove = null;
      async function renderTable() {
        const tbody = document.getElementById("songsTableBody");
        if (!songList.length) {
          tbody.innerHTML = '<tr><td colspan="6">No songs yet.</td></tr>';
          return;
        }
        tbody.innerHTML = "";
        for (let i = 0; i < songList.length; i++) {
          const song = songList[i];
          const row = tbody.insertRow();
          row.dataset.index = i;
          row.dataset.id = song.id;

          const handleCell = row.insertCell(0);
          handleCell.style.cursor = "grab";
          handleCell.style.textAlign = "center";
          handleCell.style.userSelect = "none";
          handleCell.style.textContent = "二";
          handleCell.classList.add("drag-handle");
          handleCell.draggable = true;

          const isCategory = song.id === 999;
          handleCell.draggable = !isCategory;
          handleCell.style.cursor = isCategory ? "default" : "grab";

          // credits: YouTube
          const svg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg",
          );
          svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
          svg.setAttribute("height", "24");
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("width", "24");
          svg.setAttribute("focusable", "false");
          svg.setAttribute("aria-hidden", "true");
          svg.style.pointerEvents = "none";
          svg.style.display = "block";
          svg.style.width = "20px";
          svg.style.height = "20px";
          svg.style.margin = "0 auto";
          if (isCategory) {
            svg.style.opacity = "0.3";
          }

          const path1 = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path1.setAttribute(
            "d",
            "M20 7H4a1 1 0 000 2h16a1 1 0 100-2Zm0 8H4a1 1 0 000 2h16a1 1 0 100-2Z",
          );
          path1.style.fill = "#888";

          svg.appendChild(path1);
          handleCell.appendChild(svg);

          handleCell.addEventListener("dragstart", (e) => {
            if (isCategory) {
              e.preventDefault();
              return;
            }
            draggedRow = row;
            dragInitialIndex = parseInt(row.dataset.index);
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", String(dragInitialIndex));

            const ghost = row.cloneNode(true);
            ghost.style.position = "fixed";
            ghost.style.pointerEvents = "none";
            ghost.style.opacity = "0.6";
            ghost.style.transform = "scale(0.95)";
            ghost.style.width = row.offsetWidth + "px";
            ghost.style.background = "#2d2d3a";
            ghost.style.border = "2px solid #ff79c6";
            ghost.style.borderRadius = "8px";
            ghost.style.zIndex = "9999";
            ghost.style.boxShadow = "0 8px 32px rgba(0,0,0,0.4)";
            document.body.appendChild(ghost);
            dragGhost = ghost;

            const rect = row.getBoundingClientRect();
            ghost.style.top = e.clientY - 20 + "px";
            ghost.style.left = e.clientX - 40 + "px";

            row.style.opacity = "0.3";

            if (dragInsertLine) {
              dragInsertLine.remove();
              dragInsertLine = null;
            }

            if (ghostMouseMove) {
              document.removeEventListener("mousemove", ghostMouseMove);
              ghostMouseMove = null;
            }

            ghostMouseMove = (ev) => {
              if (dragGhost) {
                dragGhost.style.top = ev.clientY - 20 + "px";
                dragGhost.style.left = ev.clientX - 40 + "px";
              }
            };
            document.addEventListener("mousemove", ghostMouseMove);
          });

          handleCell.addEventListener("dragend", () => {
            if (dragGhost) {
              document.body.removeChild(dragGhost);
              dragGhost = null;
            }
            if (dragInsertLine) {
              dragInsertLine.remove();
              dragInsertLine = null;
            }
            if (ghostMouseMove) {
              document.removeEventListener("mousemove", ghostMouseMove);
              ghostMouseMove = null;
            }
            document.querySelectorAll("tr").forEach((tr) => {
              tr.style.opacity = "1";
              tr.classList.remove("drag-over");
            });
            if (draggedRow) {
              draggedRow.style.opacity = "1";
              draggedRow = null;
            }
            dragInitialIndex = -1;
          });

          row.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            if (!draggedRow || draggedRow === row) return;

            const rect = row.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            const insertAbove = e.clientY < mid;

            if (dragInsertLine) {
              dragInsertLine.remove();
              dragInsertLine = null;
            }
            const line = document.createElement("div");
            line.style.position = "fixed";
            line.style.height = "2px";
            line.style.backgroundColor = "#ff79c6";
            line.style.left = rect.left + "px";
            line.style.width = rect.width + "px";
            line.style.zIndex = "9998";
            if (insertAbove) {
              line.style.top = rect.top - 1 + "px";
            } else {
              line.style.top = rect.bottom - 1 + "px";
            }
            document.body.appendChild(line);
            dragInsertLine = line;

            row.dataset.insertAbove = insertAbove ? "true" : "false";
          });

          row.addEventListener("dragleave", (e) => {
            if (dragInsertLine && !row.contains(e.relatedTarget)) {
              dragInsertLine.remove();
              dragInsertLine = null;
            }
          });

          row.addEventListener("drop", async (e) => {
            e.preventDefault();
            if (dragInsertLine) {
              dragInsertLine.remove();
              dragInsertLine = null;
            }

            if (!draggedRow || draggedRow === row) return;

            const fromIndex = parseInt(draggedRow.dataset.index);
            const toIndex = parseInt(row.dataset.index);
            if (fromIndex === toIndex) return;

            const insertAbove = row.dataset.insertAbove === "true";
            let targetIndex = toIndex;
            if (!insertAbove) {
              targetIndex = toIndex + 1;
            }
            let newIndex = targetIndex;
            if (fromIndex < newIndex) {
              newIndex = targetIndex - 1;
            }

            const [movedSong] = songList.splice(fromIndex, 1);
            songList.splice(toIndex, 0, movedSong);

            try {
              await apiRequest("/songs/reorder", "PUT", { songs: songList });
              document.getElementById("statusMsg").innerHTML =
                "Reordered songs";
              renderTable();
              songsHash = JSON.stringify(songList);
            } catch (err) {
              alert("Reorder failed: " + err.message);
              await loadSongs();
            }
          });

          row.insertCell(1).textContent = song.id;
          row.insertCell(2).textContent = song.name;
          row.insertCell(3).innerHTML =
            `<a href="${song.url}" target="_blank" style="color:#ff79c6;">link</a>`;

          const cellLyircs = row.insertCell(4);
          cellLyircs.textContent = "...";
          async () => {
            try {
              const lyrics = await loadLyrics(sond.id);
              cellLyircs.textContent = `${lyrics.length} lines`;
            } catch (e) {
              cellLyircs.textContent = "0 lines";
            }
          };

          const actions = row.insertCell(5);
          const editBtn = document.createElement("button");
          editBtn.textContent = "Edit";
          editBtn.onclick = () => editSong(song.id);

          const delBtn = document.createElement("button");
          delBtn.textContent = "Delete";
          delBtn.className = "danger";
          delBtn.onclick = () => deleteSong(song.id);

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
        }
      }

      function convertLyrics(text) {
        let cleaned = text.trim();
        if (cleaned.startsWith("return")) {
          cleaned = cleaned.replace(/^\s*return\s*/, "").trim();
        }
        if (cleaned.startsWith("(") && cleaned.startsWith(")")) {
          cleaned = cleaned.slice(1, -1);
        }
        let result;

        try {
          const parse = new Function("return " + cleaned);
          result = parse();
        } catch (e) {
          console.warn("Failed, falling back to eval:", e);
          try {
            result = eval("(" + cleaned + ")");
          } catch (e2) {
            throw new Error("Failed to parse lyrics: " + e2.message);
          }
        }

        if (!Array.isArray(result)) throw new Error("Got: " + typeof reuslt);
        for (let i = 0; i < result.length; i++) {
          const item = result[i];
          if (typeof item.chat !== "string" || typeof item.delay !== "number") {
            throw new Error(
              'item at index ${i} is invalid: missing "chat" (string) or "delay" (number).',
            );
          }
        }

        return result;
      }

      function onConvert() {
        const raw = document.getElementById("lyrics").value.trim();
        if (!raw) {
          alert("paste lyrics first");
          return;
        }
        try {
          const converted = convertLyrics(raw);
          const jsonStr = JSON.stringify(converted, null, 2);
          document.getElementById("lyrics").value = jsonStr;
          document.getElementById("statusMsg").innerHTML =
            `Converted ${converted.length} lines to JSON`;
        } catch (err) {
          alert("Conversation failed: " + err.message);
          console.error(err);
        }
      }

      document
        .getElementById("syncGitBtn")
        .addEventListener("click", async () => {
          const btn = document.getElementById("syncGitBtn");
          const originalText = btn.textContent;
          btn.textContent = "";
          btn.disabled = true;
          try {
            await apiRequest("/sync-github", "POST");
            document.getElementById("statusMsg").innerHTML =
              "Synced to GitHub successfully";
          } catch (err) {
            alert("Sync failed: " + err.message);
            document.getElementById("statusMsg").innerHTML =
              "Synced to GitHub failed";
          } finally {
            btn.textContent = originalText;
            btn.disabled = false;
          }
        });

      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadSongs);
      document.getElementById("saveBtn").addEventListener("click", saveSong);
      document.getElementById("clearBtn").addEventListener("click", clearForm);
      document
        .getElementById("convertBtn")
        .addEventListener("click", onConvert);
      document.getElementById("apiUrl").value = window.location.origin;

      loadSongs();
    </script>
  </body>
</html>
